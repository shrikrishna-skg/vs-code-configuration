<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">VS Code multi-agent engineering configuration</title>
  <desc id="desc">Astra and Fable engineering leads coordinate DeepSeek, GLM, Luna, and a local Claude CLI bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="0.55" stop-color="#11234a"/>
      <stop offset="1" stop-color="#231546"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d6ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="62" r="150" fill="#5b21b6" opacity=".12"/>
  <circle cx="120" cy="380" r="190" fill="#0891b2" opacity=".10"/>
  <text x="70" y="88" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">REPRODUCIBLE • DIRECT-FIRST • VERIFIED</text>
  <text x="70" y="157" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="750">VS Code Configuration</text>
  <text x="70" y="202" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="23">A practical multi-agent engineering system for Kilo Code</text>
  <path d="M340 299 H490 M680 299 H805 M970 299 H1110" stroke="url(#accent)" stroke-width="3" opacity=".75"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#glow)"><rect x="70" y="254" width="270" height="90" rx="18" fill="#0f2947" stroke="#38bdf8"/><text x="205" y="292" fill="#e0f2fe" font-size="18" font-weight="700">ENGINEERING LEAD</text><text x="205" y="321" fill="#7dd3fc" font-size="15">Astra or Fable</text></g>
    <g><rect x="490" y="254" width="190" height="90" rx="18" fill="#172554" stroke="#818cf8"/><text x="585" y="292" fill="#eef2ff" font-size="18" font-weight="700">ROUTER</text><text x="585" y="321" fill="#c7d2fe" font-size="15">scope + risk</text></g>
    <g><rect x="805" y="242" width="165" height="114" rx="18" fill="#2e1065" stroke="#c084fc"/><text x="887" y="279" fill="#faf5ff" font-size="17" font-weight="700">SPECIALISTS</text><text x="887" y="307" fill="#e9d5ff" font-size="14">DeepSeek • GLM</text><text x="887" y="331" fill="#e9d5ff" font-size="14">Luna</text></g>
    <g><rect x="1110" y="254" width="110" height="90" rx="18" fill="#312e81" stroke="#a5b4fc"/><text x="1165" y="292" fill="#eef2ff" font-size="16" font-weight="700">VERIFY</text><text x="1165" y="321" fill="#c7d2fe" font-size="13">evidence</text></g>
  </g>
