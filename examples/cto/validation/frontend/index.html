<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Center · CTO validation</title><link rel="stylesheet" href="styles.css"></head><body><header><p>WORKSPACE / REPORTS</p><h1>Report Center</h1><p>Create, find and manage your reports.</p></header><main><section class="panel"><h2>Create report</h2><form id="create-form"><label for="title">Report title</label><input id="title" name="title"><label for="period">Period</label><select id="period" name="period"><option>Monthly</option><option>Quarterly</option></select><p id="form-error" role="alert"></p><button type="submit">Create report</button></form></section><section class="panel"><div class="library-heading"><h2>Report library</h2><span id="count" role="status"></span></div><div class="filters"><label>Search reports<input id="search" type="search" placeholder="Search by title"></label><label>Status<select id="status"><option value="all">All statuses</option><option value="draft">Draft</option><option value="ready">Ready</option></select></label><label class="checkbox"><input id="include-archived" type="checkbox">Include archived</label></div><div id="reports"></div></section></main><script type="module" src="app.mjs"></script></body></html>
